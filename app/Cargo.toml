[package]
name = "know-your-wifi"
version = "2.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[[bin]]
name = "kyw"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
getrandom = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snow = "0.9.6"

[build-dependencies]
cc = "1"

[profile.release]
strip = true
lto = "thin"
